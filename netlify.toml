[build]
  publish = "."
  command = "echo 'No build command needed'"

# Redirect API calls to Render backend
# استبدل hrpro-backend-xxxx.onrender.com برابط Backend الفعلي بعد النشر
[[redirects]]
  from = "/api/*"
  to = "https://hrpro-backend-xxxx.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:;"
